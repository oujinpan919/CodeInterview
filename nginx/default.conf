# ============================================================
# 码上记 CodeInterview · 单机部署 Nginx 配置（T18）
# V1 部署形态：Nginx 托管 frontend/dist（SPA）+ 反代 /api 到后端单 jar + 本机 MySQL。
# V1 仅站长一人访问（本机 / 局域网 HTTP），不做 HTTPS / 域名 / 备案（V1.5）。
#
# 用法（Docker）：把本文件挂到 /etc/nginx/conf.d/default.conf，
#                 把 frontend/dist 挂到 /usr/share/nginx/html，
#                 upstream 里的 backend 指 docker compose 的后端服务名。
# 用法（直接装 Nginx）：upstream 改成 127.0.0.1:8080，root 改成机器上的 dist 目录。
#
# 关键点（05 §8.1）：
#   1) SSE 必须独立 location：proxy_buffering off + gzip off + 超时 > 单流 180s；
#   2) server 段全局下发 X-Forwarded-For：框架只认 X-Forwarded-*，否则限流键全是 Nginx 地址；
#   3) SPA 必须 try_files 回退到 /index.html，否则刷新非首页路由 404。
# ============================================================

upstream codeinterview_backend {
    server backend:8080;          # 直接装 Nginx 时改为 127.0.0.1:8080
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # frontend/dist 的部署目录
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 2m;      # 批量导入 ≤1MB，留余量

    # ---- 真实客户端 IP（登录锁定/注册限频/读接口限流都依赖它）----
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;    # 仅便于人工排查，框架不读

    # ---- 全局安全头（05 §8.2）----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # ---- SSE：必须独立 location（05 §8.1）----
    location = /api/v1/ai/chat {
        proxy_pass http://codeinterview_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;                  # 关键：否则「假流式」（等最后一次性出现）
        proxy_cache off;
        proxy_read_timeout 300s;              # > 单流 180s
        proxy_connect_timeout 5s;
        chunked_transfer_encoding on;
        gzip off;                             # 事件流不可压缩/缓冲
        proxy_ignore_client_abort off;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache";
    }

    # ---- 普通 API 反代 ----
    location /api/ {
        proxy_pass http://codeinterview_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # ---- 带 hash 的静态资源长缓存 ----
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ---- SPA 回退：前端路由交给 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
