# 码上记 CodeInterview · MySQL 8.4 容器备选（仅供换机器复现时使用）
# 本机主路径是已安装的 MySQL80（3306），默认不要启动本容器。
#   启动：cd docker && docker compose up -d mysql
#   应用连接：DB_PORT=3307（或在 backend/config/application-local.yml 里改端口）
# 3306 已被本机 MySQL80 占用，容器必须映射 3307，避免两个实例冲突。
services:
  mysql:
    image: mysql:8.4
    container_name: codeinterview-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codeinterview}
      MYSQL_USER: ${DB_USERNAME:-codeinterview}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 只挂 init.sql 会缺 AI/question_view/avatar 等表；按顺序执行完整迁移与 seed。
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../db/migration-v1-expansion.sql:/docker-entrypoint-initdb.d/02-v1.sql:ro
      - ../db/migration-v2-review.sql:/docker-entrypoint-initdb.d/03-v2.sql:ro
      - ../db/migration-v3-note.sql:/docker-entrypoint-initdb.d/04-v3.sql:ro
      - ../db/migration-v4-path.sql:/docker-entrypoint-initdb.d/05-v4.sql:ro
      - ../db/migration-v5-ai-config.sql:/docker-entrypoint-initdb.d/06-v5.sql:ro
      - ../db/migration-v6-question-view.sql:/docker-entrypoint-initdb.d/07-v6.sql:ro
      - ../db/migration-v9-user-avatar.sql:/docker-entrypoint-initdb.d/08-v9.sql:ro
      - ../db/seed-extra.sql:/docker-entrypoint-initdb.d/09-seed-extra.sql:ro
      - ../db/seed-extra-500.sql:/docker-entrypoint-initdb.d/10-seed-extra-500.sql:ro
      - ../db/seed-ai-templates.sql:/docker-entrypoint-initdb.d/11-seed-ai-templates.sql:ro
      - ../db/migration-v7-category-split.sql:/docker-entrypoint-initdb.d/12-v7.sql:ro
      - ../db/migration-v8-taxonomy-align.sql:/docker-entrypoint-initdb.d/13-v8.sql:ro
      - ../db/seed-technology-talk.sql:/docker-entrypoint-initdb.d/14-seed-technology-talk.sql:ro
      - ../db/seed-technology-talk-tags.sql:/docker-entrypoint-initdb.d/15-seed-technology-talk-tags.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
