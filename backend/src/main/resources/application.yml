server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: codeinterview
  config:
    import: optional:file:./config/application-local.yml
  profiles:
    default: local
  datasource:
    # characterEncoding 只能写 Java 字符集名：UTF-8 会映射到库端 utf8mb4；
    # 照 02 §6.2 写 utf8mb4 会让 Connector/J 抛 Unsupported character encoding（已登记 02 §10）
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${MYSQL_DATABASE:codeinterview}?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:codeinterview}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
  mvc:
    throw-exception-if-no-handler-found: true
    async:
      request-timeout: 300000
  web:
    resources:
      add-mappings: false

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  file:
    name: ./logs/app.log
  level:
    com.codeinterview: INFO

admin:
  init-password: ${ADMIN_INIT_PASSWORD:}

# Sa-Token（02 §5.4）：内存会话，token 只读请求头 satoken（不读 Cookie）
sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  token-style: uuid

# 注册开关（01 F01：可关闭；关闭后注册返回 40300）
app:
  register-enabled: true

# AI 助手（05 §7）。Key 只来自 spring.config.import 加载的 config/application-local.yml
# 或环境变量 AI_API_KEY（环境变量优先级更高）；本文件不得出现真实 Key。
ai:
  enabled: ${AI_ENABLED:true}
  provider: ${AI_PROVIDER:spark}
  base-url: ${AI_BASE_URL:https://maas-api.cn-huabei-1.xf-yun.com/v2}
  model: ${AI_MODEL:spark-x2.6}
  api-key: ${AI_API_KEY:}
  thinking-enabled: false
  connect-timeout-ms: 5000
  first-token-timeout-ms: 20000
  idle-timeout-ms: 45000
  total-timeout-ms: 180000
  max-tokens: 1200
  temperature: 0.3
  max-messages: 10
  max-chars: 6000
  max-single-chars: 2000
  system-prompt-file: classpath:prompt/system.txt
  quota:
    user-daily: ${AI_USER_DAILY:30}
    site-daily: ${AI_SITE_DAILY:300}
  limit:
    user-concurrency: 1
    site-concurrency: 4
    min-interval-ms: 3000
  pool:
    core-size: 4
    max-size: 8
    queue-capacity: 20
