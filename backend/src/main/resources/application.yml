server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: codeinterview
  config:
    import: optional:file:./config/application-local.yml
  profiles:
    default: local
  datasource:
    # characterEncoding 只能写 Java 字符集名：UTF-8 会映射到库端 utf8mb4；
    # 照 02 §6.2 写 utf8mb4 会让 Connector/J 抛 Unsupported character encoding（已登记 02 §10）
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${MYSQL_DATABASE:codeinterview}?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:codeinterview}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
  mvc:
    throw-exception-if-no-handler-found: true
    async:
      request-timeout: 300000
  web:
    resources:
      add-mappings: false

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  file:
    name: ./logs/app.log
  level:
    com.codeinterview: INFO

admin:
  init-password: ${ADMIN_INIT_PASSWORD:}

# Sa-Token（02 §5.4）：内存会话，token 只读请求头 satoken（不读 Cookie）
sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  token-style: uuid

# 注册开关（01 F01：可关闭；关闭后注册返回 40300）
app:
  register-enabled: true
