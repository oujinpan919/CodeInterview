server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: codeinterview
  config:
    import: optional:file:./config/application-local.yml
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${MYSQL_DATABASE:codeinterview}?characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:codeinterview}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
  mvc:
    throw-exception-if-no-handler-found: true
    async:
      request-timeout: 300000
  web:
    resources:
      add-mappings: false

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  file:
    name: ./logs/app.log
  level:
    com.codeinterview: INFO

admin:
  init-password: ${ADMIN_INIT_PASSWORD:}
