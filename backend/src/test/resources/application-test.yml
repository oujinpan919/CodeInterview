# 测试专用数据源：与开发/生产库物理隔离。
# 先执行 scripts/setup-test-db.ps1 创建 codeinterview_test（结构 + 当前库数据副本）和测试账号。
# 测试通过 @ActiveProfiles({"mock", "test"}) 启用；mock 只负责 AI 上游，test 负责数据库。
spring:
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:127.0.0.1}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:codeinterview_test}?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${TEST_DB_USERNAME:codeinterview_test}
    password: ${TEST_DB_PASSWORD:codeinterview_test}
